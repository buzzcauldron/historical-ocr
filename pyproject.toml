[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "historical-ocr"
version = "0.1.0"
description = "Self-contained pipeline for computational-ready text from historical sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "historical-ocr contributors" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0",
  "pillow>=10.0.0",
  "pymupdf>=1.24",
  "numpy>=1.24",
  "pypdf>=4.0.0",
  "pdf2image>=1.16.0",
  "pytesseract>=0.3.10",
  "torch>=2.2",
  "torchvision>=0.17",
  "datasets>=2.18",
  "huggingface_hub>=0.23",
  "pyarrow>=15.0",
  "tkinterdnd2>=0.4.0",
  "google-generativeai>=0.7",
  "ocr-cleanup>=0.1",
  "bib-ocr>=0.1",
  "transformers>=4.30",
  "ultralytics>=8.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "strigil>=0.1",
  "playwright>=1.40",
  "transcriber-shell @ git+https://github.com/buzzcauldron/transcription-shell.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Legacy extras — same packages are in base install; kept so old pip commands still work.
ml = ["torch>=2.2", "torchvision>=0.17", "datasets>=2.18", "huggingface_hub>=0.23", "pyarrow>=15.0"]
pdf = ["pymupdf>=1.24", "numpy>=1.24", "pypdf>=4.0.0", "pdf2image>=1.16.0"]
figures = ["ultralytics>=8.0"]
trocr = ["transformers>=4.30"]
transcriber = ["transcriber-shell @ git+https://github.com/buzzcauldron/transcription-shell.git"]
strigil = ["strigil>=0.1"]
suite = [
  "historical-ocr[figures]",
  "strigil>=0.1",
  "transcriber-shell @ git+https://github.com/buzzcauldron/transcription-shell.git",
]

[project.scripts]
historical-ocr = "historical_ocr.cli:main"
historical-ocr-gui = "historical_ocr.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
