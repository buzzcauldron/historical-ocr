[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "historical-ocr"
version = "0.1.0"
description = "Self-contained pipeline for computational-ready text from historical sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "historical-ocr contributors" }]
dependencies = [
  # Core
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "requests>=2.28",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0",
  # Image / PDF
  "pillow>=10.0.0",
  "pymupdf>=1.24",
  "numpy>=1.24",
  "pypdf>=4.0.0",
  "pdf2image>=1.16.0",
  "scipy>=1.10",
  # OCR engine
  "pytesseract>=0.3.10",
  # GUI
  "tkinterdnd2>=0.4.0",
  # LLM providers (Medium / High quality tiers)
  "anthropic>=0.100",
  "google-generativeai>=0.7",
  # URL fetching
  "playwright>=1.40",
  # Sibling packages — pulled from GitHub (not on PyPI)
  "ocr-cleanup @ git+https://github.com/buzzcauldron/ocr-cleanup.git",
  "bib-ocr @ git+https://github.com/buzzcauldron/bib-ocr.git",
  "strigil @ git+https://github.com/buzzcauldron/strigil.git",
]

[project.optional-dependencies]
# ML training and advanced backends — not needed for normal Tesseract OCR.
# Install with: pip install -e ".[ml]"
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
  "datasets>=2.18",
  "huggingface_hub>=0.23",
  "pyarrow>=15.0",
  "transformers>=4.30",   # TrOCR backend
  "ultralytics>=8.0",     # YOLO figure detection
  "matplotlib>=3.7",      # training visualisation
]
dev = ["pytest>=8.0", "historical-ocr[ml]"]

# Note: manuscript-fingerprint (type-case fingerprinting for early-modern era routing)
# is an optional CLI tool, not a Python dependency:
#   pip install -e ../manuscript-fingerprint

[project.scripts]
historical-ocr = "historical_ocr.cli:main"
historical-ocr-gui = "historical_ocr.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
