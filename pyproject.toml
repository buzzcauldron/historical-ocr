[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historical-ocr"
version = "0.1.0"
description = "Self-contained pipeline for computational-ready text from historical sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "historical-ocr contributors" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0",
  "pillow>=10.0.0",
  "pymupdf>=1.24",
  "numpy>=1.24",
  "pypdf>=4.0.0",
  "pdf2image>=1.16.0",
  "pytesseract>=0.3.10",
  "torch>=2.2",
  "torchvision>=0.17",
  "datasets>=2.18",
  "huggingface_hub>=0.23",
  "pyarrow>=15.0",
  "tkinterdnd2>=0.4.0",
  "google-generativeai>=0.7",
  "pytest>=8.0",
]

[project.optional-dependencies]
figures = ["ultralytics>=8.0"]
transcriber = ["transcriber-shell>=0.1"]
strigil = ["strigil>=0.1"]
suite = [
  "historical-ocr[figures]",
  "transcriber-shell>=0.1",
  "strigil>=0.1",
]
dev = ["pytest>=8.0"]

[project.scripts]
historical-ocr = "historical_ocr.cli:main"
historical-ocr-gui = "historical_ocr.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
