[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/historical_ocr/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.env.example",
]

[tool.hatch.build.targets.wheel]
packages = ["src/historical_ocr"]

[project]
name = "historical-ocr"
dynamic = ["version"]
description = "Self-contained pipeline for computational-ready text from historical sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "historical-ocr contributors" }]
keywords = [
  "ocr",
  "historical",
  "tesseract",
  "tei",
  "digital-humanities",
  "newspapers",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing",
]
dependencies = [
  # Core
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "requests>=2.28",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0",
  # Image / PDF
  "pillow>=10.0.0",
  "pymupdf>=1.24",
  "numpy>=1.24",
  "pypdf>=4.0.0",
  "pdf2image>=1.16.0",
  "scipy>=1.10",
  # OCR engine
  "pytesseract>=0.3.10",
  # GUI
  "tkinterdnd2>=0.4.0",
  # LLM providers (Medium / High quality tiers)
  "anthropic>=0.100",
  "google-generativeai>=0.7",
  # URL fetching
  "playwright>=1.40",
]

[project.optional-dependencies]
# Sibling / ecosystem packages (GitHub; not on PyPI)
ecosystem = [
  "ocr-cleanup @ git+https://github.com/buzzcauldron/ocr-cleanup.git@master",
  "bib-ocr @ git+https://github.com/buzzcauldron/bib-ocr.git@master",
  "strigil @ git+https://github.com/buzzcauldron/strigil.git@main",
]
# ML training and advanced backends — not needed for normal Tesseract OCR.
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
  "datasets>=2.18",
  "huggingface_hub>=0.23",
  "pyarrow>=15.0",
  "transformers>=4.30",
  "ultralytics>=8.0",
  "matplotlib>=3.7",
]
dev = ["pytest>=8.0", "historical-ocr[ml,ecosystem]"]
full = ["historical-ocr[ecosystem,ml]"]

[project.urls]
Homepage = "https://github.com/buzzcauldron/historical-ocr"
Repository = "https://github.com/buzzcauldron/historical-ocr"
Issues = "https://github.com/buzzcauldron/historical-ocr/issues"
Documentation = "https://github.com/buzzcauldron/historical-ocr/blob/main/docs/USER_GUIDE.md"

[project.scripts]
historical-ocr = "historical_ocr.cli:main"
historical-ocr-gui = "historical_ocr.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
