[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "historical-ocr"
version = "0.1.0"
description = "Self-contained pipeline for computational-ready text from historical sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "historical-ocr contributors" }]
dependencies = [
  # Core
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "requests>=2.28",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0",
  # Image / PDF
  "pillow>=10.0.0",
  "pymupdf>=1.24",
  "numpy>=1.24",
  "pypdf>=4.0.0",
  "pdf2image>=1.16.0",
  "scipy>=1.10",
  # OCR
  "pytesseract>=0.3.10",
  # ML
  "torch>=2.2",
  "torchvision>=0.17",
  "datasets>=2.18",
  "huggingface_hub>=0.23",
  "pyarrow>=15.0",
  "transformers>=4.30",
  "ultralytics>=8.0",
  "matplotlib>=3.7",
  # GUI
  "tkinterdnd2>=0.4.0",
  # LLM providers
  "anthropic>=0.100",
  "google-generativeai>=0.7",
  # URL fetching
  "playwright>=1.40",
]

# Sibling packages (not on PyPI — installed by scripts/install.sh from local checkouts):
#   ocr-cleanup  →  ../ocr-cleanup        (Underwood normalization rules)
#   strigil      →  ../strigil            (power/hardware API)
#   bib-ocr      →  ../bib-ocr            (bibliography citation extraction)
#   transcriber-shell → ../transcription-shell  (manuscript transcription)
#
# To install them manually from git:
#   pip install git+https://github.com/buzzcauldron/transcription-shell.git
#   pip install -e ../ocr-cleanup  (or strigil, bib-ocr)

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["torch>=2.2", "torchvision>=0.17", "datasets>=2.18", "huggingface_hub>=0.23", "pyarrow>=15.0"]
pdf = ["pymupdf>=1.24", "numpy>=1.24", "pypdf>=4.0.0", "pdf2image>=1.16.0"]
figures = ["ultralytics>=8.0"]
trocr = ["transformers>=4.30"]
transcriber = ["transcriber-shell @ git+https://github.com/buzzcauldron/transcription-shell.git"]
suite = [
  "historical-ocr[figures,transcriber]",
]

[project.scripts]
historical-ocr = "historical_ocr.cli:main"
historical-ocr-gui = "historical_ocr.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
