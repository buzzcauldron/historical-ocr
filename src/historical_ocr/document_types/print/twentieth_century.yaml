# Twentieth-century print and reprints (1900–2000)
name: twentieth_century
language: en-Latn
era: twentieth_century
era_range: 1900-2000
script: antiqua
typeface: roman

ocr:
  model: eng_modern_historical
  lang: eng
  psm: 3
  char_blacklist: "|_"
  preprocess:
    grayscale: true
    autocontrast: true
    denoise: true
    unsharp: true
    contrast: 1.5

layout:
  backend: tesseract
  tei_section_ocr: true
  tei_section_psm: 6
  tei_section_min_gap_px: 18
  column_ocr: true
  column_ocr_psm: 6
  column_ocr_min_gutter_px: 14

ocr_combination: pdf_text_first

normalization:
  mode: modern

notes: Prefer embedded PDF text for born-digital reprints; Tesseract fallback for scans.
